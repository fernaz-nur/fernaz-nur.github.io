bio:
  - "I’m Dr. Fernaz Narin Nur, a Professor in the Department of Computer Science and Engineering at Daffodil International University, Bangladesh. My research interests include Network Security, Quantum Computing, Wireless Networks, Internet of Things (IoT), and Artificial Intelligence (AI). I’m passionate about exploring how emerging technologies can be leveraged to build secure, intelligent, and efficient systems. Throughout my career, I’ve been committed to advancing research, mentoring students, and contributing to innovations that shape the future of computing."

