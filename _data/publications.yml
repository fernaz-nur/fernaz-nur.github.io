# Publications listed on the site, newest first.
#
# To add a paper, copy an entry, paste it in, and edit the values:
#
#   title:    paper title
#   authors:  authors, in the order published
#   venue:    journal or conference, with volume and pages
#   year:     year of publication
#   type:     Journal, Conference, Book chapter or Book
#   doi:      (optional) makes the title a link to the paper
#   url:      (optional) link to use when the paper has no DOI
#   image:    (optional) picture beside the paper. Put the file in assets/publications/
#             and write its path here. Without this, a plain default picture is used.
#   image_alt, image_credit, image_license, image_license_url:
#             (needed for a figure from a paper) what the figure shows, which figure it is
#             and any changes made, then its licence and a link to that licence.
#   selected: (optional) true also shows the paper on the home page
#   note:     (optional) short label, such as "Best paper award"
#
# Keep the two-space indent, and keep the quotation marks around text values.

